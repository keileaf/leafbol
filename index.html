<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mundial 2026 — Tijuana</title>
<!-- Leaflet primero, antes que cualquier script que use L.* -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap');

:root {
  --bg: #0a0f1a;
  --surface: #111827;
  --surface2: #1a2235;
  --border: #1e2d45;
  --accent: #e8c23a;
  --accent2: #2ecc71;
  --red: #e74c3c;
  --blue: #3b82f6;
  --text: #e8eaf0;
  --muted: #6b7a99;
  --live: #ff4444;
  --gold: #f5c842;
  --silver: #a0aec0;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── HEADER ─────────────────────────────────── */
header {
  background: linear-gradient(135deg, #0a0f1a 0%, #0d1b2e 100%);
  border-bottom: 2px solid var(--accent);
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.trophy { font-size: 1.8rem; }
.header-text h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.75rem;
  letter-spacing: 2px;
  color: var(--accent);
  line-height: 1;
}
.header-text p {
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 1px;
}
.header-right {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
}
.clock {
  font-family: 'Roboto Mono', monospace;
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent);
}
.clock-sub {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── NOTIF BUTTON ────────────────────────────── */
.notif-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  color: var(--muted);
  transition: border-color 0.2s, color 0.2s;
  flex-shrink: 0;
}
.notif-btn:hover { border-color: var(--accent); color: var(--accent); }
.notif-btn.active { border-color: var(--accent2); color: var(--accent2); }

/* ── TEAM FILTER BAR ─────────────────────────── */
.team-filter-bar {
  background: var(--bg);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.team-search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
}
.team-search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 32px 7px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.team-search-input::placeholder { color: var(--muted); }
.team-search-input:focus { border-color: var(--accent); }
.team-search-icon {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 0.85rem;
  pointer-events: none;
  color: var(--muted);
}
.team-search-clear {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--muted); font-size: 1rem;
  cursor: pointer; padding: 0;
  display: none;
}
.team-search-clear.visible { display: block; }
.team-search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: none;
}
.team-search-results.open { display: block; }
.search-result-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: background 0.15s;
}
.search-result-item:hover { background: var(--surface2); }
.search-result-item img { width: 22px; height: 16px; object-fit: cover; border-radius: 2px; }
.search-result-item .match-info { font-size: 0.65rem; color: var(--muted); margin-left: auto; }
.filter-active-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: var(--accent);
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  flex-shrink: 0;
}
.filter-active-pill img { width: 18px; height: 13px; object-fit: cover; border-radius: 2px; filter: brightness(0); }
.filter-active-pill .clear-x { font-size: 0.9rem; opacity: 0.6; }

/* ── API STATUS CHIP ─────────────────────────── */
.api-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.62rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--muted);
  margin-left: 6px;
  vertical-align: middle;
}
.api-chip.live { background: #0d2a0d; color: var(--accent2); }
.api-chip.err  { background: #2a0d0d; color: var(--red); }
.api-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.api-chip.live .api-dot { animation: pulse 2s infinite; }

/* ── STAGE NAV ───────────────────────────────── */
.stage-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}
.stage-nav::-webkit-scrollbar { display: none; }
.stage-btn {
  flex-shrink: 0;
  padding: 11px 13px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.stage-btn:hover { color: var(--text); }
.stage-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── DATE BAR ────────────────────────────────── */
.date-bar {
  background: var(--surface2);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.date-bar::-webkit-scrollbar { display: none; }
.date-pill {
  flex-shrink: 0;
  padding: 7px 10px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
  min-width: 50px;
  position: relative;
}
.date-pill:hover { border-color: var(--accent); color: var(--text); }
.date-pill.active { background: var(--accent); border-color: var(--accent); color: #000; }
.date-pill.is-today:not(.active) { border-color: var(--accent2); }
.date-pill .pday { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; line-height: 1; }
.date-pill .pdow { font-size: 0.58rem; text-transform: uppercase; opacity: 0.75; margin-top: 1px; }
.date-pill.is-today .pdow { color: var(--accent2); opacity: 1; font-weight: 700; }
.date-pill.active .pdow { color: #000; opacity: 0.6; }

/* ── MAIN ────────────────────────────────────── */
main { padding: 14px 12px; max-width: 680px; margin: 0 auto; }

.day-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.day-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  color: var(--accent);
  letter-spacing: 1px;
}
.match-count {
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* stage divider */
.stage-divider {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  padding: 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.stage-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── MATCH CARD ──────────────────────────────── */
.match-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.1s;
  position: relative;
}
.match-card:active { transform: scale(0.99); }

/* upcoming: accent border top */
.match-card.upcoming { border-top: 2px solid var(--accent); }
/* today */
.match-card.today-card { border-color: #2a3d60; }
/* finished */
.match-card.finished { opacity: 0.85; }
/* final highlight */
.match-card.is-final { border-color: var(--gold); }
.match-card.is-final .match-time { color: var(--gold); }
.match-card.team-highlight { border-left: 3px solid var(--accent); }

/* meta row */
.match-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px 0;
  flex-wrap: wrap;
}
.group-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.ko-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: #0d2218;
  color: var(--accent2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.final-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: #2a2000;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.status-badge {
  font-size: 0.6rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-left: auto;
}
.status-badge.done { background: #0d1f0d; color: var(--accent2); }
.status-badge.upcoming-b { background: #1a1500; color: var(--accent); }

.venue-text {
  font-size: 0.62rem;
  color: var(--muted);
  margin-left: auto;
}

/* match body — 3-col grid */
.match-body {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 10px 12px 12px;
  gap: 6px;
}

.team { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.team.away { align-items: flex-end; }
.team-flag {
  width: 36px; height: 26px;
  object-fit: cover;
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  display: block;
}
.team-flag-emoji { font-size: 2rem; line-height: 1; }
.team-name {
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.2;
}
.team.away .team-name { text-align: right; }
.team-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  color: var(--accent2);
  line-height: 1;
}
.team-score.winner { color: var(--gold); }

/* center column */
.match-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 56px;
}
.match-time {
  font-family: 'Roboto Mono', monospace;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  text-align: center;
}
.match-vs {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
}
.score-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  color: var(--text);
  letter-spacing: 4px;
  line-height: 1;
}
.score-ft {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ── EMPTY STATE ─────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 52px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
.empty-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--surface2);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.empty-sub { font-size: 0.8rem; color: var(--muted); }
.next-match-hint {
  margin-top: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  display: inline-block;
  text-align: left;
  max-width: 320px;
  width: 100%;
}
.next-match-hint .hint-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 6px;
}
.next-match-hint .hint-game {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
}
.next-match-hint .hint-time {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 3px;
}

/* ── RESULTS NOTE ───────────────────────────── */
.results-note {
  font-size: 0.68rem;
  color: var(--muted);
  text-align: center;
  padding: 8px 12px;
  background: var(--surface2);
  border-radius: 8px;
  margin-bottom: 12px;
  line-height: 1.5;
}
.results-note a { color: var(--accent); text-decoration: none; }

/* ── STANDINGS BUTTON ────────────────────────── */
.standings-btn {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 1rem;
  cursor: pointer;
  color: var(--text);
  transition: border-color 0.2s, background 0.2s;
  line-height: 1;
}
.standings-btn:hover { border-color: var(--accent); background: var(--surface2); }

/* ── STANDINGS MODAL ─────────────────────────── */
.standings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  backdrop-filter: blur(3px);
}
.standings-overlay.open { display: block; }
.standings-modal {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(95vw, 520px);
  max-height: 85vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  z-index: 301;
  overflow: hidden;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.standings-modal.open { display: flex; }
.standings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.standings-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 1px;
  color: var(--accent);
}
.standings-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: color 0.2s;
}
.standings-close:hover { color: var(--text); }
.group-selector {
  display: flex;
  gap: 4px;
  padding: 10px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.group-selector::-webkit-scrollbar { display: none; }
.grp-btn {
  flex-shrink: 0;
  padding: 5px 11px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.grp-btn:hover { border-color: var(--accent); color: var(--text); }
.grp-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
.standings-table-wrap {
  overflow-y: auto;
  flex: 1;
  padding: 12px;
}
.standings-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}
.standings-table th {
  text-align: center;
  padding: 6px 4px;
  color: var(--muted);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
}
.standings-table th:first-child { text-align: left; padding-left: 8px; }
.standings-table td {
  text-align: center;
  padding: 8px 4px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.standings-table td:first-child { text-align: left; padding-left: 4px; }
.standings-table tr:last-child td { border-bottom: none; }
.standings-table tr.qualified td { color: var(--accent2); }
.standings-table tr.qualified-3rd td { color: var(--accent); }
.std-team {
  display: flex;
  align-items: center;
  gap: 6px;
}
.std-team img { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; }
.std-pos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  color: var(--muted);
  min-width: 16px;
  text-align: center;
}
.std-pts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  color: var(--accent);
}
.std-note {
  font-size: 0.65rem;
  color: var(--muted);
  padding: 8px 4px 2px;
  display: flex;
  gap: 12px;
}
.std-note span { display: flex; align-items: center; gap: 4px; }
.std-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ── QUINIELA ────────────────────────────────── */
.predict-section {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.predict-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  font-weight: 700;
}
.predict-nickname-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.predict-nickname-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.predict-nickname-input::placeholder { color: var(--muted); }
.predict-nickname-input:focus { border-color: var(--accent); }
.predict-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
}
.predict-team-name {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  text-align: center;
  line-height: 1.2;
}
.predict-score-input {
  width: 42px;
  height: 38px;
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--accent);
  outline: none;
  transition: border-color 0.2s;
}
.predict-score-input:focus { border-color: var(--accent); }
.predict-dash { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--muted); }
.predict-btn {
  width: 100%;
  padding: 8px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #000;
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.predict-btn:hover { opacity: 0.85; }
.predict-btn:disabled { opacity: 0.4; cursor: default; }
.predict-result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.predict-voted { font-size: 0.75rem; color: var(--muted); }
.predict-voted strong { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--text); }
.predict-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

// ════════════════════════════════════════════════════
//  ZONA HORARIA LOCAL DEL VISITANTE
//  Los partidos están en ET (UTC-4 verano).
//  Convertimos a UTC y mostramos en la zona del browser.
// ════════════════════════════════════════════════════

// Zona detectada del browser
const USER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const USER_TZ_SHORT = (() => {
  try {
    // Nombre corto: "PDT", "CEST", "JST", etc.
    return new Intl.DateTimeFormat('en', { timeZoneName:'short', timeZone: USER_TZ })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName').value;
  } catch(_) { return 'Local'; }
})();

// Convierte "YYYY-MM-DD" + "HH:MM AM/PM" ET → Date UTC
function etToDate(dateStr, etStr) {
  const [time, ampm] = etStr.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  // ET verano = UTC-4 → sumar 4h para obtener UTC
  const [y, mo, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, mo - 1, d, h + 4, m));
}

// Formatea un Date en la zona del usuario: "3:00 PM"
function formatLocalTime(date) {
  return date.toLocaleTimeString([], {
    timeZone: USER_TZ,
    hour: 'numeric', minute: '2-digit', hour12: true
  });
}

// Fecha local del usuario para saber "hoy"
function todayLocal() {
  return new Date().toLocaleDateString('en-CA', { timeZone: USER_TZ }); // "YYYY-MM-DD"
}

function nowLocal() {
  return new Date().toLocaleString('en-CA', {
    timeZone: USER_TZ,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12: false
  }).replace(',', '');
}

// Compatibilidad: mantener todayTijuana apuntando a todayLocal
function todayTijuana() { return todayLocal(); }
function nowTijuana()   { return nowLocal(); }

// Para comparar si un partido ya pasó: usamos el Date UTC real
function matchDateUTC(m) {
  return etToDate(m.d, m.et);
}

function isFinished(m) {
  // terminado si han pasado 2h desde el inicio
  return Date.now() > matchDateUTC(m).getTime() + 2 * 60 * 60 * 1000;
}

function isUpcoming(m) {
  return Date.now() < matchDateUTC(m).getTime();
}

// Reemplaza matchDateTime (se usaba para notificaciones)
function matchDateTime(m) {
  const dt = matchDateUTC(m);
  const local = dt.toLocaleString('en-CA', {
    timeZone: USER_TZ,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12: false
  }).replace(',', '');
  return local;
}

// Calcular hora local del visitante para cada partido
const MATCHES = RAW.map(m => {
  const utcDate = etToDate(m.d, m.et);
  return {
    ...m,
    pdt: formatLocalTime(utcDate),
    _utc: utcDate.getTime(),
    // Fecha local del usuario (puede diferir de m.d si está en otra zona)
    localDate: utcDate.toLocaleDateString('en-CA', { timeZone: USER_TZ })
  };
});

// ─── FECHAS DISPONIBLES ──────────────────────────────────────
const allDates = [...new Set(MATCHES.map(m => m.localDate))].sort();

// ─── STAGES ──────────────────────────────────────────────────
const STAGES = [
  { id:'all',   label:'Todos' },
  { id:'group', label:'Grupos',   from:'2026-06-11', to:'2026-06-27' },
  { id:'R32',   label:'Ronda 32', from:'2026-06-28', to:'2026-07-03' },
  { id:'R16',   label:'Octavos',  from:'2026-07-04', to:'2026-07-07' },
  { id:'QF',    label:'Cuartos',  from:'2026-07-09', to:'2026-07-11' },
  { id:'SF',    label:'Semis',    from:'2026-07-14', to:'2026-07-15' },
  { id:'Final', label:'Final',    from:'2026-07-18', to:'2026-07-19' },
];

// ─── STATE ───────────────────────────────────────────────────
let currentStage = 'all';
let currentDate  = null;

// ─── HELPERS ─────────────────────────────────────────────────
function filteredDates() {
  if (currentStage === 'all') return allDates;
  const st = STAGES.find(s => s.id === currentStage);
  if (!st?.from) return allDates;
  return allDates.filter(d => d >= st.from && d <= st.to);
}

function formatDatePill(ds) {
  const [y,mo,d] = ds.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  const dows = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  return { day: d, dow: dows[dt.getDay()] };
}

function formatFullDate(ds) {
  const [y,mo,d] = ds.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  const days  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio'];
  return `${days[dt.getDay()]} ${d} de ${months[mo-1]}`;
}

function stageLabel(m) {
  if (m.g) return `Grupo ${m.g}`;
  const MAP = { R32:'Ronda de 32', R16:'Octavos de Final', QF:'Cuartos de Final',
                SF:'Semifinal',    '3P':'Tercer Lugar',     Final:'Gran Final' };
  return MAP[m.s] || m.s;
}

function badgeClass(m) {
  if (m.g)         return 'group-badge';
  if (m.s==='Final') return 'final-badge';
  return 'ko-badge';
}

// ─── RENDER STAGE NAV ────────────────────────────────────────
function renderStageNav() {
  document.getElementById('stageNav').innerHTML = STAGES.map(s =>
    `<button class="stage-btn${s.id===currentStage?' active':''}" onclick="selectStage('${s.id}')">${s.label}</button>`
  ).join('');
}

// ─── RENDER DATE BAR ─────────────────────────────────────────
function renderDateBar() {
  const dates  = filteredDates();
  const today  = todayTijuana();
  const bar    = document.getElementById('dateBar');
  bar.innerHTML = dates.map(d => {
    const { day, dow } = formatDatePill(d);
    const isToday  = d === today;
    const isActive = d === currentDate;
    return `<div class="date-pill${isActive?' active':''}${isToday?' is-today':''}" onclick="selectDate('${d}')">
      <div class="pday">${day}</div>
      <div class="pdow">${isToday ? '● HOY' : dow}</div>
    </div>`;
  }).join('');
  // scroll to active pill
  setTimeout(() => {
    const el = bar.querySelector('.date-pill.active');
    if (el) el.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }, 60);
}

// ─── RENDER MATCHES ──────────────────────────────────────────
function renderMatches() {
  const today    = todayTijuana();
  const isToday  = currentDate === today;
  const isPast   = currentDate < today;
  const matches  = MATCHES.filter(m => m.localDate === currentDate);
  const main     = document.getElementById('mainContent');

  // ── Sin partidos en esta fecha ──
  if (!matches.length) {
    // Buscar el próximo día con partidos
    const nextDay = allDates.find(d => d > (currentDate || today));
    let hint = '';
    if (nextDay) {
      const nm = MATCHES.find(m => m.localDate === nextDay);
      hint = `<div class="next-match-hint">
        <div class="hint-label">⚡ Próximos partidos</div>
        <div class="hint-game">${formatFullDate(nextDay)}</div>
        <div class="hint-time">${MATCHES.filter(m=>m.d===nextDay).length} partidos · desde las ${MATCHES.filter(m=>m.d===nextDay)[0].pdt}</div>
      </div>`;
    }
    main.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📅</div>
      <div class="empty-title">Sin partidos</div>
      <div class="empty-sub">No hay juegos programados para este día</div>
      ${hint}
    </div>`;
    return;
  }

  // ── Encabezado del día ──
  const dayLabel = isToday ? `HOY · ${formatFullDate(currentDate)}` : formatFullDate(currentDate);
  const totalCount = matches.length;
  const doneCount  = matches.filter(m => isFinished(m)).length;
  let countLabel = `${totalCount} ${totalCount===1?'partido':'partidos'}`;
  if (isPast && doneCount === totalCount) countLabel += ' · Terminados';
  else if (doneCount > 0)                 countLabel += ` · ${doneCount} terminados`;

  let html = `<div class="day-header">
    <div class="day-title">${dayLabel}</div>
    <div class="match-count">${countLabel}</div>
  </div>`;

  // Nota de resultados para días pasados
  if (isPast) {
    html += `<div class="results-note">
      📊 Los marcadores mostrados son ilustrativos. Para resultados reales visita 
      <a href="https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026" target="_blank">FIFA.com</a>
    </div>`;
  }

  // ── Agrupar por stage key ──
  let lastStageKey = null;
  matches.forEach(m => {
    const sk = m.g || m.s;
    const sl = stageLabel(m);
    if (sk !== lastStageKey) {
      lastStageKey = sk;
      html += `<div class="stage-divider">${sl}</div>`;
    }

    const finished  = isFinished(m);
    const upcoming  = isUpcoming(m);
    const isFinal   = m.s === 'Final';

    // Estado del partido
    let statusBadge = '';
    if (finished) {
      statusBadge = `<span class="status-badge done">✓ Terminado</span>`;
    } else if (isToday && !upcoming) {
      statusBadge = `<span class="status-badge" style="background:#1a0a00;color:var(--live)">● En juego?</span>`;
    } else if (isToday) {
      statusBadge = `<span class="status-badge upcoming-b">Hoy ${m.pdt}</span>`;
    }

    // Card classes
    let cardClass = 'match-card';

    if (finished && m.score) {
      const hw = m.score.h > m.score.a;
      const aw = m.score.a > m.score.h;
      center = `<div class="score-display">${m.score.h}–${m.score.a}</div>
                <div class="score-ft">Final</div>`;
    } else {
      center = `<div class="match-time">${m.pdt}</div>
                <div class="match-vs">vs</div>`;
    }

    html += `<div class="${cardClass}">
      <div class="match-meta">
        <span class="${badgeClass(m)}">${sl}</span>
        ${statusBadge}
        <span class="venue-text">📍 ${m.v}</span>
      </div>

        <div class="team">
          ${flagImg(m.h)}
          <div class="team-name">${m.h}</div>

        <div class="match-center">${center}</div>
        <div class="team away">
          ${flagImg(m.a)}
          <div class="team-name">${m.a}</div>
        </div>
      </div>
    </div>`;
  });

  main.innerHTML = html;
}

// Sobreescribir renderMatches para filtrar por equipo
const _renderMatchesOrig = renderMatches;
function renderMatches() {
  // ── Guardar valores de inputs activos antes de re-renderizar ──
  const savedInputs = {};
  document.querySelectorAll('input[id^="ph_"], input[id^="pa_"], input[id^="nick_"]').forEach(el => {
    if (document.activeElement === el || el.value !== '' && el.value !== '0') {
      savedInputs[el.id] = el.value;
    }
  });
  const focusedId = document.activeElement ? document.activeElement.id : null;

  const today    = todayTijuana();
  const isToday  = currentDate === today;
  const isPast   = currentDate < today;

  let matches = MATCHES.filter(m => m.localDate === currentDate);
  // Aplicar filtro de equipo si está activo
  if (teamFilter) {
    matches = matches.filter(m => m.h === teamFilter || m.a === teamFilter);
  }

  const main = document.getElementById('mainContent');

  if (!matches.length) {
    let hint = '';
    const nextDates = teamFilter
      ? allDates.filter(d => d > (currentDate || today) && MATCHES.some(m => m.localDate === d && (m.h === teamFilter || m.a === teamFilter)))
      : allDates.filter(d => d > (currentDate || today));
    const nextDay = nextDates[0];
    if (nextDay) {
      const nm = MATCHES.find(m => m.localDate === nextDay);
      const count = MATCHES.filter(m => m.localDate === nextDay && (!teamFilter || m.h === teamFilter || m.a === teamFilter)).length;
      hint = `<div class="next-match-hint">
        <div class="hint-label">⚡ Próximos ${teamFilter ? 'partidos de '+teamFilter : 'partidos'}</div>
        <div class="hint-game">${formatFullDate(nextDay)}</div>
        <div class="hint-time">${count} ${count===1?'partido':'partidos'} · desde las ${MATCHES.filter(m=>m.d===nextDay)[0].pdt}</div>
      </div>`;
    }
    main.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📅</div>
      <div class="empty-title">Sin partidos</div>
      <div class="empty-sub">${teamFilter ? `${teamFilter} no juega este día` : 'No hay juegos programados para este día'}</div>
      ${hint}
    </div>`;
    return;
  }

  const dayLabel = isToday ? `HOY · ${formatFullDate(currentDate)}` : formatFullDate(currentDate);
  const totalCount = matches.length;
  const doneCount  = matches.filter(m => isFinished(m)).length;
  let countLabel = `${totalCount} ${totalCount===1?'partido':'partidos'}`;
  if (isPast && doneCount === totalCount) countLabel += ' · Terminados';
  else if (doneCount > 0) countLabel += ` · ${doneCount} terminados`;

  // API status chip
  let apiChip = '';
  if (apiStatus === 'live') apiChip = `<span class="api-chip live"><span class="api-dot"></span> Live</span>`;
  else if (apiStatus === 'err') apiChip = `<span class="api-chip err"><span class="api-dot"></span> Sin API</span>`;
  else apiChip = `<span class="api-chip"><span class="api-dot"></span> Cargando</span>`;

  let html = `<div class="day-header">
    <div class="day-title">${dayLabel}${isToday ? apiChip : ''}</div>
    <div class="match-count">${countLabel}</div>
  </div>`;

  if (isPast && apiStatus !== 'live') {
    html += `<div class="results-note">
      📊 Marcadores del día. Para estadísticas detalladas: 
      <a href="https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026" target="_blank">FIFA.com</a>
    </div>`;
  }

  let lastStageKey = null;
  matches.forEach(m => {
    const sk = m.g || m.s;
    const sl = stageLabel(m);
    if (sk !== lastStageKey) {
      lastStageKey = sk;
      html += `<div class="stage-divider">${sl}</div>`;
    }

    const finished  = isFinished(m);
    const upcoming  = isUpcoming(m);
    const isFinal   = m.s === 'Final';
    const isMyTeam  = teamFilter && (m.h === teamFilter || m.a === teamFilter);

    let statusBadge = '';
    const liveScore = liveScores[`${m.d}|${m.h}|${m.a}`];
    const hasScore  = liveScore || (finished && m.score);

    if (liveScore && liveScore.state === 'post') {
      statusBadge = `<span class="status-badge done">✓ Final · ${liveScore.h}–${liveScore.a}</span>`;
    } else if (finished && m.score) {
      statusBadge = `<span class="status-badge done">✓ Final · ${m.score.h}–${m.score.a}</span>`;
    } else if (liveScore && liveScore.state === 'in') {
      statusBadge = `<span class="status-badge" style="background:#1a0500;color:var(--live)">● En juego · ${liveScore.h}–${liveScore.a}</span>`;
    } else if (isToday && !upcoming) {
      statusBadge = `<span class="status-badge" style="background:#1a0500;color:var(--live)">● En juego</span>`;
    } else if (isToday) {
      statusBadge = `<span class="status-badge upcoming-b">Hoy ${m.pdt}</span>`;
    }

    let cardClass = 'match-card';
    if (isToday)            cardClass += ' today-card';
    if (upcoming && isToday) cardClass += ' upcoming';
    if (finished)           cardClass += ' finished';
    if (isFinal)            cardClass += ' is-final';
    if (isMyTeam && !isFinal) cardClass += ' team-highlight';

    let center = '';
    if (liveScore) {
      const isLive     = liveScore.state === 'in';
      const scoreColor = isLive ? 'var(--live)' : 'var(--accent2)';
      const clockLabel = liveScore.detail === 'FT' ? 'Final'
                       : liveScore.detail === 'HT' ? 'Medio tiempo'
                       : liveScore.detail || (liveScore.state === 'post' ? 'Final' : '');
      center = `<div class="score-display" style="color:${scoreColor}">${liveScore.h}–${liveScore.a}</div>
                <div class="score-ft" style="${isLive ? 'color:var(--live)' : ''}">${clockLabel}</div>`;
    } else if (finished && m.score) {
      center = `<div class="score-display" style="color:var(--accent2)">${m.score.h}–${m.score.a}</div>
                <div class="score-ft">Final</div>`;
    } else {
      center = `<div class="match-time">${m.pdt}</div>
                <div class="match-vs">vs</div>`;
    }

    // Goles y tarjetas desde liveScores
    const allGoals   = liveScore ? (liveScore.goals || []) : [];
    const allCards   = liveScore ? (liveScore.cards || []) : [];
    let detailsHtml  = '';
    if (allGoals.length || allCards.length) {
      const hGoals = allGoals.filter(g => normalizeTeamName(g.team)===m.h||g.team===m.h);
      const aGoals = allGoals.filter(g => normalizeTeamName(g.team)===m.a||g.team===m.a);
      const hCards = allCards.filter(c => normalizeTeamName(c.team)===m.h||c.team===m.h);
      const aCards = allCards.filter(c => normalizeTeamName(c.team)===m.a||c.team===m.a);
      const rg  = g => `<div class="detail-event"><span class="icon-goal">⚽</span><span class="detail-player">${g.player||''}${g.og?' <i>(PP)</i>':''}</span><span class="detail-min">${g.min?g.min+"'":''}</span></div>`;
      const rga = g => `<div class="detail-event away"><span class="detail-min">${g.min?g.min+"'":''}</span><span class="detail-player">${g.player||''}${g.og?' <i>(PP)</i>':''}</span><span class="icon-goal">⚽</span></div>`;
      const rc  = c => `<div class="detail-event"><span class="icon-${c.type}"></span><span class="detail-player">${c.player||''}</span><span class="detail-min">${c.min?c.min+"'":''}</span></div>`;
      const rca = c => `<div class="detail-event away"><span class="detail-min">${c.min?c.min+"'":''}</span><span class="detail-player">${c.player||''}</span><span class="icon-${c.type}"></span></div>`;
      detailsHtml = `<div class="match-details">
        <div class="match-detail-col">${hGoals.map(rg).join('')}${hCards.map(rc).join('')}</div>
        <div class="match-detail-col away">${aGoals.map(rga).join('')}${aCards.map(rca).join('')}</div>
      </div>`;
    }

    // Sección de quiniela
    const matchKey   = `${m.d}|${m.h}|${m.a}`;
    const predictHtml = buildPredictSection(m, matchKey, finished || (liveScore && liveScore.state === 'post'));

    html += `<div class="${cardClass}">
      <div class="match-meta">
        <span class="${badgeClass(m)}">${sl}</span>
        ${statusBadge}
        <span class="venue-text">📍 ${m.v}</span>
      </div>
      <div class="match-body">
        <div class="team">
          ${flagImg(m.h)}
          <div class="team-name">${m.h}</div>
        </div>
        <div class="match-center">${center}</div>
        <div class="team away">
          ${flagImg(m.a)}
          <div class="team-name">${m.a}</div>
        </div>
      </div>
      ${detailsHtml}
      ${predictHtml}
    </div>`;
  });

  main.innerHTML = html;

  // ── Restaurar valores de inputs que el usuario estaba editando ──
  Object.entries(savedInputs).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el) { el.focus(); el.setSelectionRange && el.setSelectionRange(el.value.length, el.value.length); }
  }
}

// ─── RANKING DE CAMPEONES ────────────────────────────────────
function renderRanking() {
  const el = document.getElementById('rankingBody');
  if (!el) return;

  // Construir lista ordenada: pts desc, exactos desc, ganadores desc, nombre asc
  const list = Object.entries(nickPoints)
    .map(([k, v]) => ({ ...v, key: k }))
    .filter(v => v.points > 0)
    .sort((a, b) =>
      b.points - a.points ||
      b.exact  - a.exact  ||
      b.winner - a.winner ||
      a.display.localeCompare(b.display)
    );

  if (!list.length) {
    el.innerHTML = '<div class="ranking-empty">Aún no hay resultados calculados</div>';
    return;
  }

  const myNick = normalizeNick(window.__myApodo || '');

  // ── Podio (top 3) ──
  const crowns = ['🥇','🥈','🥉'];
  const pClasses = ['p1','p2','p3'];
  const top3 = list.slice(0, 3);

  // Reordenar podio: 2do izq, 1ro centro, 3ro derecha
  const podiumOrder = [top3[1], top3[0], top3[2]].filter(Boolean);
  const podiumBars  = top3[1] ? [pClasses[1], pClasses[0], pClasses[2]] : [pClasses[0]];
  const podiumCrowns = top3[1] ? [crowns[1], crowns[0], crowns[2]] : [crowns[0]];

  let podiumHtml = '<div class="ranking-podium">';
  podiumOrder.forEach((p, i) => {
    const origIdx = top3.indexOf(p);
    podiumHtml += `<div class="podium-place">
      <div class="podium-crown">${podiumCrowns[i]}</div>
      <div class="podium-name">${p.display}</div>
      <div class="podium-pts">${p.points} pts</div>
      <div class="podium-bar ${podiumBars[i]}">${p.points}</div>
      <div class="podium-stats">🎯${p.exact} &nbsp; ✅${p.winner}</div>
    </div>`;
  });
  podiumHtml += '</div>';

  // ── Tabla completa ──
  let tableHtml = `<table class="ranking-table">
    <thead><tr>
      <th class="num">#</th>
      <th>Apodo</th>
      <th class="num">🎯</th>
      <th class="num">✅</th>
      <th class="num">Pts</th>
    </tr></thead><tbody>`;

  list.forEach((p, i) => {
    const isMe = myNick && p.key === myNick;
    const posClass = i < 3 ? 'top' : '';
    tableHtml += `<tr class="${isMe ? 'me' : ''}">
      <td class="num"><span class="ranking-pos ${posClass}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i+1}</span></td>
      <td><span class="ranking-nick">${p.display}${isMe ? '<span class="me-badge">← tú</span>' : ''}</span></td>
      <td class="exact-col">${p.exact || '—'}</td>
      <td class="winner-col">${p.winner || '—'}</td>
      <td class="pts">${p.points}</td>
    </tr>`;
  });

  tableHtml += '</tbody></table>';
  el.innerHTML = podiumHtml + tableHtml;
}

// ─── API DE RESULTADOS ───────────────────────────────────────
// El proxy está en Apps Script (mundial2026_visitors.gs)
// que llama a football-data.org server-side sin problema de CORS.
// Solo necesitas que WEBAPP_URL esté configurada abajo.
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyKbKuySM8_7RFfr5QLlzg-M5dvdN9tJ514mjGeXLs4kLne8IpbCKhlftaIXGlNrW_nNg/exec';

let liveScores = {};   // key: "YYYY-MM-DD|Home|Away"
let apiStatus  = 'off'; // 'off' | 'live' | 'err'

async function fetchLiveScores() {
  try {
    const res  = await fetch(`${WEBAPP_URL}?action=scores`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'sin datos');

    liveScores = {};

    // 1. Históricos guardados en Sheets (con goles y tarjetas)
    (data.saved || []).forEach(m => {
      const match = findMatch(m.home, m.away);
      if (!match) return;
      const key = `${match.d}|${match.h}|${match.a}`;
      if (!match.score) {
        liveScores[key] = {
          h: m.homeScore, a: m.awayScore,
          state: 'post', detail: 'FT',
          goals: m.goals || [], cards: m.cards || []
        };
      }
    });

    // 2. Scores en vivo de ESPN (sobreescribe con dato más reciente)
    (data.matches || []).forEach(m => {
      if (m.state === 'pre') return;
      const match = findMatch(m.home, m.away);
      if (!match) { console.log('ESPN no encontrado:', m.home, 'vs', m.away); return; }
      const key = `${match.d}|${match.h}|${match.a}`;
      liveScores[key] = {
        h: m.homeScore, a: m.awayScore,
        state: m.state, detail: m.detail,
        goals: m.goals || [], cards: m.cards || []
      };
      console.log('✅', match.h, m.homeScore, '-', m.awayScore, match.a, '|', m.detail);
    });

    apiStatus = 'live';
    clearInterval(pollInterval);
    pollInterval = setInterval(fetchLiveScores, data.hasLive ? 30000 : 60000);

  } catch(e) {
    console.warn('Scores proxy:', e);
    apiStatus = 'err';
  }
  renderMatches();
}

  'Panama':'Panamá','Uzbekistan':'Uzbekistán','Colombia':'Colombia',
  'Croatia':'Croacia','Qatar':'Qatar','Switzerland':'Suiza',
  'Paraguay':'Paraguay','New Zealand':'Nueva Zelanda',
  'Cabo Verde':'Cabo Verde','Cape Verde Islands':'Cabo Verde'
};

function normalizeTeamName(name) {
  if (!name) return '';
  // Búsqueda exacta primero
  if (TEAM_NAME_MAP[name]) return TEAM_NAME_MAP[name];
  // Búsqueda case-insensitive
  const lower = name.toLowerCase();
  for (const [k, v] of Object.entries(TEAM_NAME_MAP)) {
    if (k.toLowerCase() === lower) return v;
  }
  // Búsqueda por inclusión parcial (para nombres como "Bosnia and Herz...")
  for (const [k, v] of Object.entries(TEAM_NAME_MAP)) {
    if (lower.includes(k.toLowerCase()) || k.toLowerCase().includes(lower)) return v;
  }
  return name;
}

// Busca el partido en MATCHES de forma flexible
function findMatch(homeName, awayName) {
  const h = normalizeTeamName(homeName);
  const a = normalizeTeamName(awayName);
  // Búsqueda exacta después de normalizar
  return MATCHES.find(mx =>
    normalizeTeamName(mx.h) === h && normalizeTeamName(mx.a) === a
  );
}

function statusLabel(s) {
  const MAP = {
    'SCHEDULED':'Programado','LIVE':'En juego','IN_PLAY':'En juego',
    'PAUSED':'Medio tiempo','FINISHED':'Final','POSTPONED':'Pospuesto',
    'SUSPENDED':'Suspendido','CANCELLED':'Cancelado'
  };
  return MAP[s] || s;
}

let notifEnabled = false;
let notifPermission = 'default';
let scheduledNotifs = new Set(); // IDs de partidos ya notificados

async function toggleNotifications() {
  if (!('Notification' in window)) {
    alert('Tu navegador no soporta notificaciones 😕');
    return;
  }

  if (notifEnabled) {
    // Desactivar
    notifEnabled = false;
    localStorage.setItem('notifEnabled', '0');
    updateNotifBtn();
    showToast('🔕 Notificaciones desactivadas');
    return;
  }

  // Pedir permiso si no lo tenemos
  if (Notification.permission === 'default') {
    notifPermission = await Notification.requestPermission();
  } else {
    notifPermission = Notification.permission;
  }

  if (notifPermission === 'granted') {
    notifEnabled = true;
    localStorage.setItem('notifEnabled', '1');
    updateNotifBtn();
    scheduleMatchNotifications();
    showToast('🔔 Te avisaré 15 min antes de cada partido');
  } else {
    showToast('⚠️ Activa permisos de notificaciones en tu navegador');
  }
}

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  btn.textContent = notifEnabled ? '🔔' : '🔕';
  btn.classList.toggle('active', notifEnabled);
  btn.title = notifEnabled ? 'Notificaciones activadas' : 'Activar notificaciones';
}

function scheduleMatchNotifications() {
  if (!notifEnabled || Notification.permission !== 'granted') return;

  const now    = Date.now();
  const today  = todayTijuana();
  // Solo partidos de hoy y mañana
  const upcoming = MATCHES.filter(m => m.d >= today && !isFinished(m));

  upcoming.forEach(m => {
    const mdt = matchDateTime(m); // "YYYY-MM-DD HH:MM"
    const [dateStr, timeStr] = mdt.split(' ');
    const [h, min] = timeStr.split(':').map(Number);
    const [y, mo, d] = dateStr.split('-').map(Number);

    // Crear Date en zona local asumiendo que matchDateTime ya está en PDT
    // Usamos UTC offset -7
    const matchMs = Date.UTC(y, mo-1, d, h+7, min); // convertir PDT→UTC sumando 7h
    const notifMs = matchMs - 15 * 60 * 1000; // 15 min antes
    const key     = `${m.d}|${m.h}|${m.a}`;

    if (notifMs > now && !scheduledNotifs.has(key)) {
      scheduledNotifs.add(key);
      const delay = notifMs - now;
      setTimeout(() => {
        if (notifEnabled && Notification.permission === 'granted') {
          new Notification(`⚽ Partido en 15 min — Mundial 2026`, {
            body: `${m.h} vs ${m.a}\n🕐 ${m.pdt} · ${m.v}`,
            icon: `https://flagcdn.com/40x30/${FLAG_CODES[m.h] || 'xx'}.png`,
            badge: 'https://flagcdn.com/20x15/un.png',
            tag: key
          });
        }
      }, delay);
    }
  });
}

// Orden de sorteo FIFA como desempate final (cuando todo lo demás está igualado)
// Basado en el orden oficial del sorteo de la Copa Mundial 2026
const FIFA_DRAW_ORDER = {
  'A': ['México','Corea del Sur','Chequia','Sudáfrica'],
  'B': ['Suiza','Canadá','Qatar','Bosnia-Herzegovina'],
  'C': ['Brasil','Marruecos','Escocia','Haití'],
  'D': ['EUA','Australia','Turquía','Paraguay'],
  'E': ['Alemania','Costa de Marfil','Ecuador','Curazao'],
  'F': ['Países Bajos','Japón','Suecia','Túnez'],
  'G': ['Bélgica','Irán','Egipto','Nueva Zelanda'],
  'H': ['España','Uruguay','Arabia Saudita','Cabo Verde'],
  'I': ['Francia','Noruega','Senegal','Irak'],
  'J': ['Argentina','Austria','Argelia','Jordania'],
  'K': ['Portugal','Colombia','Uzbekistán','Rep. Dem. Congo'],
  'L': ['Inglaterra','Panamá','Croacia','Ghana']
};

function calcStandings(group) {
  const groupMatches = MATCHES.filter(m => m.g === group);
  const teams = [...new Set(groupMatches.flatMap(m => [m.h, m.a]))];

  const stats = {};
  teams.forEach(t => {
    stats[t] = { team: t, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
  });

  groupMatches.forEach(m => {
    const key = `${m.d}|${m.h}|${m.a}`;
    const ls  = liveScores[key];
    let sh = null, sa = null;

    if (ls && (ls.state === 'post' || ls.detail === 'FT' || ls.detail === 'Final')) {
      sh = ls.h; sa = ls.a;
    } else if (m.score) {
      sh = m.score.h; sa = m.score.a;
    }

    if (sh === null || sa === null) return;

    const home = stats[m.h];
    const away = stats[m.a];
    home.pj++; away.pj++;
    home.gf += sh; home.gc += sa;
    away.gf += sa; away.gc += sh;

    if (sh > sa) {
      home.g++; home.pts += 3; away.p++;
    } else if (sh === sa) {
      home.e++; home.pts++; away.e++; away.pts++;
    } else {
      away.g++; away.pts += 3; home.p++;
    }
    home.dif = home.gf - home.gc;
    away.dif = away.gf - away.gc;
  });

  const drawOrder = FIFA_DRAW_ORDER[group] || [];

  return Object.values(stats).sort((a, b) => {
    // 1. Puntos
    if (b.pts !== a.pts) return b.pts - a.pts;
    // 2. Diferencia de goles
    if (b.dif !== a.dif) return b.dif - a.dif;
    // 3. Goles a favor
    if (b.gf !== a.gf) return b.gf - a.gf;
    // 4. Orden del sorteo FIFA (criterio final)
    return drawOrder.indexOf(a.team) - drawOrder.indexOf(b.team);
  });
}

function renderStandings(group) {
  const rows  = calcStandings(group);
  const wrap  = document.getElementById('standingsTableWrap');

  let html = `<table class="standings-table">
    <thead>
      <tr>
        <th colspan="2">Equipo</th>
        <th>PJ</th><th>G</th><th>E</th><th>P</th>
        <th>GF</th><th>GC</th><th>DIF</th>
        <th class="std-pts">PTS</th>

    </thead>

  rows.forEach((r, i) => {
    const code = FLAG_CODES[r.team];
    const flag = code ? `<img src="https://flagcdn.com/20x15/${code}.png" alt="">` : '';
    // Top 2 clasifican directo, posición 3 puede clasificar como mejor 3ro
    const rowClass = i < 2 ? 'qualified' : i === 2 ? 'qualified-3rd' : '';
    html += `<tr class="${rowClass}">
      <td><span class="std-pos">${i+1}</span></td>
      <td><div class="std-team">${flag}<span>${r.team}</span></div></td>
      <td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td>
      <td>${r.gf}</td><td>${r.gc}</td>
      <td>${r.dif > 0 ? '+'+r.dif : r.dif}</td>
      <td class="std-pts">${r.pts}</td>
    </tr>`;
  });

  html += `</tbody></table>
    <div class="std-note">
      <span><span class="std-dot" style="background:var(--accent2)"></span> Clasificado</span>
      <span><span class="std-dot" style="background:var(--accent)"></span> Posible mejor 3ro</span>
    </div>`;

  wrap.innerHTML = html;
}

// ─── QUINIELA / PREDICCIONES ─────────────────────────────────
const myPredictions = {}; // cache local: matchKey → {homeGoal, awayGoal, result, points}
const matchVotes    = {}; // cache: matchKey → {total, homeWin, draw, awayWin}

// Normaliza apodo: minusculas + trim (a = A)
function normalizeNick(nick) {
  return (nick || '').toLowerCase().trim();
}

// Mapa global de puntos acumulados: normalizedNick -> {exact, winner, points, display}
const nickStars  = {}; // exactos (para compatibilidad con renderStars)
const nickPoints = {}; // tabla completa: {exact, winner, points, display}

function updateNickStars(votes) {
  if (!votes || !votes.predictions) return;
  votes.predictions.forEach(p => {
    if (!p.result || p.result === '') return;
    const k = normalizeNick(p.apodo);
    const display = p.apodo; // preservar capitalización original
    if (!nickPoints[k]) nickPoints[k] = { exact: 0, winner: 0, points: 0, display };
    if (p.result === 'exact') {
      nickStars[k]  = (nickStars[k] || 0) + 1;
      nickPoints[k].exact  += 1;
      nickPoints[k].points += 3;
    } else if (p.result === 'winner') {
      nickPoints[k].winner  += 1;
      nickPoints[k].points  += 1;
    }
  });
  renderRanking();
}

function starsFor(apodo) {
  return nickStars[normalizeNick(apodo)] || 0;
}

function renderStars(n) {
  if (!n) return '';
  return ' ' + '⭐'.repeat(Math.min(n, 10));
}

// Cargar predicción previa del usuario para un partido
async function loadMyPrediction(matchKey) {
  if (!myIP) return null;
  // Si ya tenemos la predicción pero el partido terminó y aún no tiene result,
  // volver a pedir al servidor por si ya calculó el resultado
  const cached = myPredictions[matchKey];
  const match  = MATCHES.find(m => `${m.d}|${m.h}|${m.a}` === matchKey);
  const fin    = match && isFinished(match);
  if (cached !== undefined && !(fin && cached && !cached.result)) return cached;

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=myprediction&match=${encodeURIComponent(matchKey)}&ip=${encodeURIComponent(myIP)}`);
    const data = await res.json();
    myPredictions[matchKey] = data.found ? data : null;
    return myPredictions[matchKey];
  } catch(_) { return null; }
}

// Cargar votos totales de un partido
async function loadMatchVotes(matchKey) {
  // Si ya tenemos datos PERO el partido ya terminó, siempre refrescar
  // para que lleguen los result actualizados del servidor
  const match = MATCHES.find(m => `${m.d}|${m.h}|${m.a}` === matchKey);
  const alreadyFinished = match && isFinished(match);
  if (matchVotes[matchKey] && !alreadyFinished) return matchVotes[matchKey];

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=predictions&match=${encodeURIComponent(matchKey)}`);
    const data = await res.json();

    // ── Calcular result localmente si el servidor no lo devuelve ──
    if (data && data.predictions) {
      // Obtener marcador real: primero liveScores, luego datos hardcoded
      let realH = null, realA = null;
      const ls = liveScores[matchKey];
      if (ls && (ls.state === 'post' || ls.detail === 'FT')) {
        realH = Number(ls.h); realA = Number(ls.a);
      } else if (match && match.score) {
        realH = match.score.h; realA = match.score.a;
      }

      if (realH !== null && realA !== null) {
        const realWinner = realH > realA ? 'home' : realA > realH ? 'away' : 'draw';
        let exactW = [], resultW = [];

        data.predictions = data.predictions.map(p => {
          if (p.result) return p; // si el servidor ya lo calculó, respetar
          const pH = Number(p.homeGoal), pA = Number(p.awayGoal);
          const pWinner = pH > pA ? 'home' : pA > pH ? 'away' : 'draw';
          if (pH === realH && pA === realA) {
            exactW.push(p.apodo);
            return { ...p, result: 'exact' };
          } else if (pWinner === realWinner) {
            resultW.push(p.apodo);
            return { ...p, result: 'winner' };
          } else {
            return { ...p, result: 'miss' };
          }
        });

        // Solo sobrescribir ganadores si el servidor no los mandó
        if (!data.exactWinners  || data.exactWinners.length  === 0) data.exactWinners  = exactW;
        if (!data.resultWinners || data.resultWinners.length === 0) data.resultWinners = resultW;
      }
    }

    updateNickStars(data);
    matchVotes[matchKey] = data;
    return data;
  } catch(_) { return null; }
}

// Enviar predicción
async function submitPrediction(matchKey, home, away, homeGoal, awayGoal, btnEl) {
  if (!myIP) { showToast('⚠️ Espera un momento, cargando tu IP...'); return; }
  btnEl.disabled = true;
  btnEl.textContent = 'Guardando...';
  try {
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'predict', ip: myIP,
        matchKey, home, away,
        homeGoal: Number(homeGoal),
        awayGoal: Number(awayGoal),
        apodo: window.__pendingApodo || ''
      })
    });
    const data = await res.json();
    if (data.alreadyVoted) {
      showToast('⚠️ Ya votaste en este partido');
      btnEl.disabled = false;
      btnEl.textContent = 'Votar';
      return;
    }
    if (data.nicknameTaken) {
      showToast('⚠️ Ese apodo ya está en uso para este partido, elige otro');
      btnEl.disabled = false;
      btnEl.textContent = 'Votar';
      return;
    }
    if (data.ok) {
      myPredictions[matchKey] = { found: true, homeGoal: Number(homeGoal), awayGoal: Number(awayGoal), apodo: window.__pendingApodo, result: null, points: 0 };
      window.__pendingApodo = '';
      delete matchVotes[matchKey]; // invalidar cache de votos
      showToast('✅ ¡Predicción guardada!');
      renderMatches(); // re-renderizar para mostrar "ya votaste"
    } else {
      showToast('❌ Error: ' + (data.error || 'intenta de nuevo'));
      btnEl.disabled = false;
      btnEl.textContent = 'Votar';
    }
  } catch(e) {
    showToast('❌ Error de conexión');
    btnEl.disabled = false;
    btnEl.textContent = 'Votar';
  }
}

// Generar HTML de la sección de quiniela para una card
function buildPredictSection(m, matchKey, isFinished) {
  const pred   = myPredictions[matchKey]; // puede ser null, undefined, o el objeto
  const votes  = matchVotes[matchKey];
  const closed = isFinished || isMatchStarted(m); // votación cerrada si ya empezó

  let html = `<div class="predict-section">
    <div class="predict-label">⚽ Adivina el marcador | la votacion se cierra al comienzo del partido</div>`;

  // Si ya votó o el partido terminó → mostrar resultado
  if (pred && pred.found) {
    // Calcular result localmente si el servidor no lo devolvió
    let result = pred.result;
    if (!result && isFinished) {
      const ls = liveScores[matchKey];
      let realH = null, realA = null;
      if (ls && (ls.state === 'post' || ls.detail === 'FT')) {
        realH = Number(ls.h); realA = Number(ls.a);
      } else if (m.score) {
        realH = m.score.h; realA = m.score.a;
      }
      if (realH !== null && realA !== null) {
        const pH = Number(pred.homeGoal), pA = Number(pred.awayGoal);
        const realWinner = realH > realA ? 'home' : realA > realH ? 'away' : 'draw';
        const pWinner    = pH > pA       ? 'home' : pA > pH       ? 'away' : 'draw';
        if (pH === realH && pA === realA)   result = 'exact';
        else if (pWinner === realWinner)     result = 'winner';
        else                                 result = 'miss';
      }
    }
    const badge = result
      ? `<span class="predict-badge ${result}">${
          result==='exact'  ? '🎯 Exacto +3pts' :
          result==='winner' ? '✅ Ganador +1pt' : '❌ Fallaste'
        }</span>`
      : `<span class="predict-badge pending">⏳ Pendiente</span>`;

    html += `<div class="predict-result">
      <div class="predict-voted">Tu pronóstico: <strong>${pred.homeGoal}–${pred.awayGoal}</strong></div>
      ${badge}
    </div>`;
  }
  // Si no ha votado y el partido no ha empezado → mostrar formulario
  else if (!closed && pred === null) {
    const inputId = matchKey.replace(/[|]/g,'_');
    html += `<div class="predict-nickname-row">
      <input class="predict-nickname-input" type="text" maxlength="20" placeholder="Tu apodo (requerido)" id="nick_${inputId}" required>
    </div>
    <div class="predict-inputs">
      <span class="predict-team-name">${m.h}</span>
      <input class="predict-score-input" type="number" min="0" max="20" value="0" id="ph_${inputId}">
      <span class="predict-dash">–</span>
      <input class="predict-score-input" type="number" min="0" max="20" value="0" id="pa_${inputId}">
      <span class="predict-team-name">${m.a}</span>
    </div>
    <button class="predict-btn" onclick="(function(){
      const k='${matchKey.replace(/'/g,"\\'")}';
      const h=document.getElementById('ph_${inputId}').value;
      const a=document.getElementById('pa_${inputId}').value;
      const nickEl=document.getElementById('nick_${inputId}');
      const nick=nickEl.value.trim();
      if (!nick) {
        nickEl.style.borderColor = 'var(--red)';
        nickEl.focus();
        showToast('⚠️ Escribe un apodo para votar');
        return;
      }
      window.__pendingApodo = normalizeNick(nick);
      submitPrediction(k,'${m.h.replace(/'/g,"\\'")}','${m.a.replace(/'/g,"\\'")}',h,a,this);
    }).call(this)">Votar pronóstico</button>`;
  }
  // Partido ya empezó y no había votado
  else if (closed && (!pred || !pred.found)) {
    html += `<div class="predict-voted" style="color:var(--muted)">⛔ Votación cerrada</div>`;
  }
  // Cargando predicción del usuario
  else {
    html += `<div class="predict-voted" style="color:var(--muted)">Cargando...</div>`;
  }

  // Barra de votos globales — visible cuando el partido ya empezó o hay datos
  if (votes && votes.total > 0 && closed) {
    const t  = votes.total;
    const hw = Math.round(votes.homeWin / t * 100);
    const d  = Math.round(votes.draw    / t * 100);
    const aw = 100 - hw - d;
    html += `<div class="predict-votes-bar">
      <div class="bar-home"  style="width:${hw}%"></div>
      <div class="bar-draw"  style="width:${d}%"></div>
      <div class="bar-away"  style="width:${aw}%"></div>
    </div>
    <div class="predict-votes-info">
      <span>🏠 ${hw}%</span>
      <span>${t} votos</span>
      <span>${aw}% 🚌</span>
    </div>`;

    // Lista de pronósticos individuales (visible en juego y al terminar)
    html += `<div class="predict-all-list">`;
    votes.predictions.forEach(p => {
      const badge = p.result === 'exact'  ? '🎯' :
                    p.result === 'winner' ? '✅' :
                    p.result === 'miss'   ? '❌' : '';
      html += `<div class="predict-all-row">
        <span class="pal-apodo">${p.apodo}${renderStars(starsFor(p.apodo))}</span>
        <span class="pal-score">${p.homeGoal}–${p.awayGoal}</span>
        ${badge ? `<span class="pal-badge">${badge}</span>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Resultados de la quiniela (solo cuando el partido terminó)
  if (isFinished && votes && votes.total > 0) {
    // Obtener el marcador real (hardcodeado o de ESPN)
    let realH = null, realA = null;
    const ls = liveScores[matchKey];
    if (ls && (ls.state === 'post' || ls.detail === 'FT')) {
      realH = Number(ls.h); realA = Number(ls.a);
    } else if (m.score) {
      realH = m.score.h; realA = m.score.a;
    }

    // Si el backend ya calculó los puntos, usar esos; si no, calcular en frontend
    let exactWinners  = votes.exactWinners  || [];
    let resultWinners = votes.resultWinners || [];

    if (realH !== null && (exactWinners.length === 0 && resultWinners.length === 0)) {
      // Calcular localmente desde predictions
      const realWinner = realH > realA ? 'home' : realA > realH ? 'away' : 'draw';
      votes.predictions.forEach(p => {
        const pH = Number(p.homeGoal), pA = Number(p.awayGoal);
        const pWinner = pH > pA ? 'home' : pA > pH ? 'away' : 'draw';
        if (pH === realH && pA === realA) {
          exactWinners.push(p.apodo);
          p.result = 'exact'; // inyectar para que updateNickStars lo acumule
        } else if (pWinner === realWinner) {
          resultWinners.push(p.apodo);
          p.result = 'winner';
        } else {
          p.result = 'miss';
        }
      });
      // Acumular en el ranking global
      updateNickStars(votes);
    }

    if (realH === null) {
      html += `<div class="predict-winners"><div class="predict-winners-row nobody">⏳ Resultado pendiente...</div></div>`;
    } else {
      html += `<div class="predict-winners">`;
      html += `<div class="predict-winners-row score-real">⚽ Resultado: <strong>${realH}–${realA}</strong></div>`;
      if (exactWinners.length > 0) {
        html += `<div class="predict-winners-row exact">
          <span>🎯 Acertaron el resultado exacto:</span>
          <span class="w-names">${exactWinners.map(n => n + renderStars(starsFor(n))).join(', ')}</span>
        </div>`;
      }
      if (resultWinners.length > 0) {
        html += `<div class="predict-winners-row winner">
          <span>✅ Acertaron el ganador:</span>
          <span class="w-names">${resultWinners.map(n => n + renderStars(starsFor(n))).join(', ')}</span>
        </div>`;
      }
      if (exactWinners.length === 0 && resultWinners.length === 0) {
        html += `<div class="predict-winners-row nobody">😅 Nadie acertó</div>`;
      }
      html += `</div>`;
    }
  }

  html += `</div>`;
  return html;
}

// El partido ya empezó si su hora UTC ya pasó
function isMatchStarted(m) {
  return Date.now() >= m._utc;
}

// Pre-carga estrellas de todos los días pasados en background (sin bloquear UI)
async function preloadPastStars() {
  // Cargar votos de TODOS los partidos terminados (días pasados + los de hoy que ya acabaron)
  const finishedMatches = MATCHES.filter(m => isFinished(m));

  // Cargar en paralelo por lotes de 4 para no saturar
  const batchSize = 4;
  for (let i = 0; i < finishedMatches.length; i += batchSize) {
    const batch = finishedMatches.slice(i, i + batchSize);
    await Promise.all(batch.map(m => {
      const key = `${m.d}|${m.h}|${m.a}`;
      return matchVotes[key] ? Promise.resolve() : loadMatchVotes(key);
    }));
  }
  // Un solo re-render al final con el ranking completo
  renderMatches();
  renderRanking();
}

// Cargar predicciones del usuario para todos los partidos del día visible
async function loadPredictionsForDay() {
  if (!myIP) return;
  const dayMatches = MATCHES.filter(m => m.localDate === currentDate);

  // Cargar myPrediction y matchVotes en PARALELO (no secuencial)
  await Promise.all(dayMatches.map(async m => {
    const key = `${m.d}|${m.h}|${m.a}`;
    const [,] = await Promise.all([
      myPredictions[key] === undefined ? loadMyPrediction(key) : Promise.resolve(),
      matchVotes[key] ? Promise.resolve() : loadMatchVotes(key)
    ]);
  }));

  renderMatches();
}

// ─── INIT ────────────────────────────────────────────────────
function init() {
  const today  = todayTijuana();
  const todayHasMatches = MATCHES.some(m => m.localDate === today);
  if (todayHasMatches) {
    currentDate = today;
  } else {
    const futureDate = allDates.find(d => d >= today);
    currentDate = futureDate || allDates[allDates.length - 1] || today;
    if (today < '2026-06-11' || today > '2026-07-19') {
      currentDate = today;
    }
  }
  renderStageNav();
  renderDateBar();
  renderMatches();
  initTimezoneLabels();
  updateClock();
  setInterval(updateClock, 15000);

  // API de resultados
  startApiPolling();

  // Notificaciones
  restoreNotifPref();

  // Re-programar notificaciones cada hora
  setInterval(scheduleMatchNotifications, 3600000);

  // Cargar predicciones del día actual (esperar a que myIP esté disponible)
  setTimeout(async () => {
    await loadPredictionsForDay();
    // Pre-cargar estrellas de días pasados en background, sin bloquear UI
    preloadPastStars();
  }, 2000);
}

init();
</script>


<script>
// ════════════════════════════════════════════════════
//  VISITOR TRACKER
// ════════════════════════════════════════════════════

let visitorMap    = null;
let mapInitialized = false;
let myLatLon      = null;
let panelOpen     = false;

// ── Toggle panel ────────────────────────────────────
function toggleVisitorPanel() {
  panelOpen = !panelOpen;
  document.getElementById('visitorPanel').classList.toggle('open', panelOpen);
  document.getElementById('visitorToggle').classList.toggle('open', panelOpen);
  if (panelOpen && !mapInitialized) {
    initMap();
    loadVisitors();
  }
}

// ── Inicializar mapa Leaflet ─────────────────────────
function initMap() {
  mapInitialized = true;
  document.getElementById('visitorMap').innerHTML = '';

  visitorMap = L.map('visitorMap', {
    center: [20, 0], zoom: 2,
    zoomControl: true,
    attributionControl: false
  });

  // Tile oscuro, sin key
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18
  }).addTo(visitorMap);

  L.control.attribution({ prefix: false })
    .addAttribution('© CartoDB')
    .addTo(visitorMap);
}

// ── Marcar un visitante en el mapa ──────────────────
function addMarker(lat, lon, label, isMe) {
  const color  = isMe ? '#2ecc71' : '#e8c23a';
  const size   = isMe ? 14 : 10;
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;
      background:${color};
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.4);
      box-shadow:0 0 6px ${color};
    "></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
  const marker = L.marker([lat, lon], { icon }).addTo(visitorMap);
  marker.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;color:#0a0f1a">${label}</div>`);
  return marker;
}

// ── Cargar visitantes desde Apps Script ─────────────
let myIP = null; // IP real del visitante actual

async function loadVisitors() {
  try {
    const res  = await fetch(WEBAPP_URL);
    const data = await res.json();
    const visitors = data.visitors || [];

    document.getElementById('visitorCount').textContent = visitors.length;
    renderVisitorList(visitors);

    if (visitorMap) {
      visitors.forEach(v => {
        // Solo marcar como "tú" si la IP coincide exactamente
        const isMe = myIP && (v.ip === myIP || v.ip === maskIPLocal(myIP));
        const label = `${v.city || ''}${v.city ? ', ' : ''}${v.country}`;
        addMarker(v.lat, v.lon, label, isMe);
      });

      // Siempre ajustar el mapa para mostrar todos los puntos
      const allPoints = visitors.map(v => [v.lat, v.lon]);
      if (myLatLon) allPoints.push(myLatLon);

      if (allPoints.length === 1) {
        visitorMap.setView(allPoints[0], 5, { animate: true });
      } else if (allPoints.length > 1) {
        visitorMap.fitBounds(allPoints, { padding: [40, 40], maxZoom: 10, animate: true });
      }
    }
  } catch(e) {
    console.warn('No se pudo cargar visitantes:', e);
    document.getElementById('visitorCount').textContent = '?';
  }
}

// Simular el masking que hace el Apps Script (X.X.*.*)
function maskIPLocal(ip) {
  const p = ip.split('.');
  if (p.length === 4) return `${p[0]}.${p[1]}.*.*`;
  return ip;
}

// ── Lista de visitantes ──────────────────────────────
function renderVisitorList(visitors) {
  const list = document.getElementById('visitorList');
  if (!visitors.length) {
    list.innerHTML = '<div class="visitor-row"><span class="visitor-loc">Sin registros aún</span></div>';
    return;
  }

  const sorted = [...visitors].sort((a,b) => new Date(b.ts) - new Date(a.ts));

  // Solo la visita más reciente del mismo IP masked se marca como "tú"
  let markedMe = false;

  list.innerHTML = sorted.slice(0, 50).map(v => {
    const code  = FLAG_CODES[v.country] || '';
    const flag  = code
      ? `<img class="visitor-flag-img" src="https://flagcdn.com/20x15/${code}.png" alt="">`
      : '🌐';
    const label = [v.city, v.region, v.country].filter(Boolean).join(', ');
    const ts    = v.ts ? timeAgo(new Date(v.ts)) : '';
    const isMe  = !markedMe && myIP && v.ip === maskIPLocal(myIP);
    if (isMe) markedMe = true;
    return `<div class="visitor-row${isMe?' visitor-me':''}">
      ${flag}
      <span class="visitor-loc">${label}${isMe ? ' 📍 (tú)' : ''}</span>
      <span class="visitor-time">${ts}</span>
    </div>`;
  }).join('');
}

// ── Tiempo relativo ──────────────────────────────────
function timeAgo(date) {
  const diff = Math.floor((Date.now() - date) / 1000);
  if (diff < 60)         return 'ahora';
  if (diff < 3600)       return `hace ${Math.floor(diff/60)}min`;
  if (diff < 86400)      return `hace ${Math.floor(diff/3600)}h`;
  return `hace ${Math.floor(diff/86400)}d`;
}

// ── Detectar IP y geolocalizar ───────────────────────
// ipinfo.io tiene CORS abierto → funciona desde GitHub Pages sin proxy
async function trackVisitor() {
  try {
    // ipinfo.io: CORS abierto, tier gratis 50k req/mes, devuelve geo completo
    const res = await fetch('https://ipinfo.io/json');
    if (!res.ok) throw new Error(`ipinfo ${res.status}`);
    const info = await res.json();

    // info = { ip, city, region, country, loc:"lat,lon", org }
    const [lat, lon] = (info.loc || '0,0').split(',').map(Number);
    if (!lat && !lon) throw new Error('Sin coordenadas');

    myLatLon = [lat, lon];
    myIP = info.ip; // IP real para identificar "tú" en la lista
    const badge = document.getElementById('myLocationBadge');
    const text  = document.getElementById('myLocationText');
    if (badge) badge.style.display = 'block';
    if (text)  text.textContent = `Tu ubicación: ${info.city}, ${info.country}`;

    // Guardar en la hoja via Apps Script (POST no-cors)
    fetch(WEBAPP_URL, {
      method:  'POST',
      mode:    'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ip:      info.ip,
        country: info.country,
        region:  info.region,
        city:    info.city,
        lat, lon,
        isp:     info.org || '',
        ua:      navigator.userAgent.slice(0, 120)
      })
    });

    if (panelOpen && visitorMap) {
      addMarker(lat, lon, `${info.city}, ${info.country} (tú)`, true);
      visitorMap.setView([lat, lon], 5, { animate: true });
    }

  } catch(e) {
    console.warn('Geolocalización falló:', e);
  }
}

// Ejecutar tracker al cargar (no bloquea nada)
trackVisitor();
</script>
